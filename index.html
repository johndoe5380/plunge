<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1a22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Plunge</title>
<style>
:root{--ground:#0c1a22;--panel:#132530;--rule:#22404f;--ice:#a8ecff;
      --deep:#3d6b7d;--amber:#d99a4e;--red:#d97b6c;--text:#dbeaf1;--muted:#7b99a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ground);color:var(--text);font-feature-settings:"tnum" 1;
     font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
     padding:max(18px,env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--rule);padding:16px;margin-top:12px}
.temp{font-size:84px;font-weight:200;line-height:1;letter-spacing:-.03em;color:var(--ice)}
.temp.warm{color:var(--deep)}
.unit{font-size:26px;color:var(--muted);margin-left:4px}
.row{display:flex;align-items:center;gap:14px}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
button{font-family:inherit;color:var(--text);background:transparent;
       border:1px solid var(--rule);border-radius:2px;cursor:pointer}
button:active{background:rgba(168,236,255,.12)}
button:disabled{opacity:.35}
.step{width:76px;height:76px;font-size:32px;font-weight:300}
.set{font-size:46px;font-weight:200;min-width:110px;text-align:center;letter-spacing:-.02em}
.set.dirty{color:var(--amber)}
.pill{padding:11px 20px;font-size:15px}
.pill.on{border-color:var(--ice);color:var(--ice)}
.tiny{font-size:12px;line-height:1.55}
input,select{font-family:inherit;background:var(--ground);color:var(--text);
             border:1px solid var(--rule);border-radius:2px;padding:9px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td{padding:8px 0;border-top:1px solid var(--rule)}
td:last-child{text-align:right;color:var(--muted)}
#spark{width:100%;height:176px;display:block;touch-action:none}
.rng{font-size:11px;padding:4px 9px;color:var(--muted)}
.rng:active{border-color:var(--ice);color:var(--ice)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px}
</style></head><body>

<div class="between">
  <div>
    <div class="tiny muted">Water</div>
    <div><span class="temp" id="cur">--</span><span class="unit">&deg;F</span></div>
  </div>
  <div style="text-align:right">
    <div id="state" style="font-size:16px"><span class="dot" id="dot"></span><span id="stateTxt">…</span></div>
    <div class="tiny muted" id="sub" style="margin-top:6px;max-width:170px"></div>
  </div>
</div>

<div class="card">
  <div class="tiny muted" style="margin-bottom:12px">Target</div>
  <div class="between">
    <div class="row">
      <button class="step" id="minus">&minus;</button>
      <div class="set" id="set">--</div>
      <button class="step" id="plus">+</button>
    </div>
    <button class="pill" id="power">&nbsp;</button>
  </div>
  <div class="tiny muted" id="writeMsg" style="margin-top:12px;min-height:17px"></div>
</div>

<div class="card">
  <div class="between" style="margin-bottom:8px">
    <div class="tiny" id="range"></div>
    <div class="row" style="gap:5px">
      <button class="rng" data-h="6">6h</button>
      <button class="rng" data-h="24">1d</button>
      <button class="rng" data-h="72">3d</button>
      <button class="rng" data-h="all">all</button>
    </div>
  </div>
  <svg id="spark" viewBox="0 0 340 176"></svg>
  <div class="tiny muted" style="margin-top:6px">Drag to scroll, pinch to zoom.
    Dashed line is the model, projected forward and never corrected.</div>
</div>

<div class="card">
  <div class="between"><div class="tiny muted">Scheduled changes</div>
    <button class="tiny" style="padding:6px 11px" id="clear">Clear all</button></div>
  <table id="timers"></table>
  <div class="row" style="margin-top:14px;flex-wrap:wrap">
    <input type="date" id="d" style="flex:1 1 140px">
    <input type="time" id="t" style="flex:1 1 104px">
    <input type="number" id="v" min="36" max="122" value="48" style="width:78px">
    <button class="pill" id="add" style="flex:1 1 92px">Add</button>
  </div>
  <div class="tiny muted" style="margin-top:10px">
    Sets the target at that time. The compressor only restarts once the water is
    5&deg;F above target, so it stops where you send it rather than overshooting.
  </div>
</div>

<div class="tiny muted" style="margin-top:16px" id="foot"></div>
<script>
const K = new URLSearchParams(location.search).get("k") || "";
const BASE = "https://cpufqbelfhkofymcpicn.supabase.co/functions/v1/app";
const api = (a, p = {}) =>
  fetch(BASE + "?" + new URLSearchParams({ k: K, action: a, ...p })).then(r => r.json());
const $ = id => document.getElementById(id);

let dev = null, pending = null, timer = null, busy = false;

function paint() {
  if (!dev) return;
  const cur = dev.temp_current_f, set = pending ?? dev.temp_set_f;
  $("cur").textContent = cur;
  $("cur").className = "temp" + (cur > 55 ? " warm" : "");
  $("set").textContent = set + "\u00B0";
  $("set").className = "set" + (pending !== null && pending !== dev.temp_set_f ? " dirty" : "");
  $("power").textContent = dev.switch ? "On" : "Off";
  $("power").className = "pill" + (dev.switch ? " on" : "");

  const cooling = dev.switch && cur > dev.temp_set_f;
  $("dot").style.background = !dev.switch ? "var(--muted)" : cooling ? "var(--ice)" : "var(--deep)";
  $("stateTxt").textContent = !dev.switch ? "Off" : cooling ? "Cooling" : "Coasting";
  $("sub").textContent = !dev.switch ? "Pump and filter are off too"
    : cooling ? "Running until it reaches " + dev.temp_set_f + "\u00B0"
    : "Restarts at " + (dev.temp_set_f + 5) + "\u00B0";
  if (dev.fault) { $("sub").textContent = "FAULT code " + dev.fault; $("sub").style.color = "var(--red)"; }

  const rows = (dev.timers || []).map(t => {
    const d = t.date.slice(4, 6) + "/" + t.date.slice(6, 8);
    return "<tr><td>" + d + " " + t.time + "</td><td>set " + t.value + "\u00B0</td></tr>";
  }).join("");
  $("timers").innerHTML = rows || "<tr><td class='muted'>Nothing scheduled</td><td></td></tr>";
  $("foot").textContent = "Updated " + new Date(dev.at).toLocaleTimeString();
}

async function refresh() {
  try { dev = await api("state"); if (pending === null) pending = dev.temp_set_f; paint(); }
  catch (e) { $("foot").textContent = "Offline — " + e; }
}

/* one command per intent: collect taps, send once you stop */
function nudge(d) {
  pending = Math.max(36, Math.min(122, (pending ?? dev.temp_set_f) + d));
  paint();
  $("writeMsg").textContent = "\u2026";
  clearTimeout(timer);
  timer = setTimeout(async () => {
    busy = true; $("writeMsg").textContent = "Sending " + pending + "\u00B0\u2026";
    try {
      dev = await api("set", { f: pending });
      $("writeMsg").textContent = dev.temp_set_f === pending
        ? "Chiller confirmed " + pending + "\u00B0"
        : "Chiller reports " + dev.temp_set_f + "\u00B0";
      pending = dev.temp_set_f; paint();
    } catch (e) { $("writeMsg").textContent = "Failed: " + e; }
    busy = false;
    setTimeout(() => { if (!busy) $("writeMsg").textContent = ""; }, 4000);
  }, 800);
}
$("minus").onclick = () => nudge(-1);
$("plus").onclick = () => nudge(1);

$("power").onclick = async () => {
  if (dev.switch && !confirm("Turn the chiller off? Filtration stops too.")) return;
  $("writeMsg").textContent = "Sending\u2026";
  dev = await api("power", { on: dev.switch ? "0" : "1" });
  pending = dev.temp_set_f; paint();
  $("writeMsg").textContent = "Chiller is " + (dev.switch ? "on" : "off");
};

$("add").onclick = async () => {
  const d = $("d").value, t = $("t").value, v = $("v").value;
  if (!d || !t) return alert("Pick a date and time");
  await api("addTimer", { date: d.replaceAll("-", ""), time: t, f: v });
  refresh();
};
$("clear").onclick = async () => {
  if (!confirm("Remove all scheduled changes?")) return;
  await api("clearTimers"); refresh();
};

/* The probe sits in the chiller loop and reports whole degrees, so the raw
   trace is a staircase with bursts of flicker where the water sits on a
   rounding boundary. Each burst marks a half-degree crossing, timed to about
   a second - collapse it to its midpoint and the line through them is real.
   The dashed line is the model projected forward from the first crossing in
   view and never corrected, so the gap is the honest error. */
var HIST = null, PAR = null, VIEW = null, SPAN = null;

function crossings(ev) {
  var STABLE = 120000, idx = [], out = [], i, n, a, b;
  for (i = 0; i < ev.length; i++)
    if (i === ev.length - 1 || ev[i + 1].t - ev[i].t >= STABLE) idx.push(i);
  for (n = 1; n < idx.length; n++) {
    a = idx[n - 1]; b = idx[n];
    if (ev[a].v === ev[b].v) continue;
    out.push({ t: (ev[a + 1].t + ev[b].t) / 2, v: (ev[a].v + ev[b].v) / 2 });
  }
  return out;
}

function setpointAt(sps, t) {
  var v = sps.length ? sps[0].v : 65, i;
  for (i = 0; i < sps.length; i++) if (sps[i].t <= t) v = sps[i].v;
  return v;
}

/* integrate the model forward: dT/dt = -k(T-Ta) - C while the compressor
   runs, and the compressor follows the chiller's own 5F deadband */
function project(t0, v0, t1, sps, P) {
  var pts = [], T = v0, step = 60000, on = false, t, set;
  for (t = t0; t <= t1; t += step) {
    set = setpointAt(sps, t);
    if (T >= set + P.hysteresis_f) on = true; else if (T <= set) on = false;
    pts.push({ t: t, v: T });
    T += (-P.k * (T - P.ambient_f) - (on ? P.c : 0)) * (step / 3600000);
  }
  return pts;
}

function fmtTick(d, span) {
  if (span > 36 * 3600000)
    return (d.getMonth() + 1) + "/" + d.getDate();
  var h = d.getHours();
  return (h % 12 === 0 ? 12 : h % 12) + (h < 12 ? "a" : "p");
}

function draw() {
  if (!HIST || !PAR) return;
  var W = 340, H = 176, L = 28, R = 8, T = 12, B = 26;
  var a = VIEW[0], b = VIEW[1], span = b - a;
  var act = HIST.cross.filter(function (p) { return p.t >= a - span && p.t <= b + span; });
  if (act.length < 2) { $("spark").innerHTML = ""; return; }

  var first = act[0];
  var pred = project(first.t, first.v, b, HIST.sps, PAR);
  var vis = act.concat(pred).filter(function (p) { return p.t >= a && p.t <= b; });
  if (!vis.length) return;
  var vals = vis.map(function (p) { return p.v; });
  var lo = Math.min.apply(null, vals) - .6, hi = Math.max.apply(null, vals) + .6;
  if (hi - lo < 2.5) { var m = (hi + lo) / 2; lo = m - 1.25; hi = m + 1.25; }

  var X = function (t) { return L + (W - L - R) * (t - a) / span; };
  var Y = function (v) { return T + (H - T - B) * (1 - (v - lo) / (hi - lo)); };
  var g = "", v, d, x;

  var stepV = (hi - lo) > 8 ? 2 : 1;
  for (v = Math.ceil(lo); v <= hi; v += stepV)
    g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) +
         '" stroke="#22404f" stroke-width=".5"/><text x="' + (L - 5) + '" y="' + (Y(v) + 3.5) +
         '" fill="#7b99a8" font-size="9" text-anchor="end">' + v + '</text>';

  var stepT = span > 36e5 * 36 ? 864e5 : span > 36e5 * 12 ? 216e5 : span > 36e5 * 4 ? 72e5 : 36e5;
  var t = Math.ceil(a / stepT) * stepT;
  for (; t <= b; t += stepT) {
    x = X(t); d = new Date(t);
    g += '<line x1="' + x + '" x2="' + x + '" y1="' + T + '" y2="' + (H - B) +
         '" stroke="#22404f" stroke-width=".5" stroke-dasharray="1 4"/><text x="' + x +
         '" y="' + (H - 12) + '" fill="#7b99a8" font-size="9" text-anchor="middle">' +
         fmtTick(d, span) + '</text>';
  }
  var dl = new Date(a);
  g += '<text x="' + L + '" y="' + (H - 2) + '" fill="#4e6f7e" font-size="8.5">' +
       dl.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }) +
       '</text>';

  var path = function (arr) {
    var s = "", i = 0, p;
    for (; i < arr.length; i++) {
      p = arr[i];
      if (p.t < a - span || p.t > b + span) continue;
      s += (s ? " L" : "M") + X(p.t).toFixed(1) + " " + Y(p.v).toFixed(1);
    }
    return s;
  };

  var tip = act[act.length - 1];
  $("spark").setAttribute("viewBox", "0 0 " + W + " " + H);
  $("spark").innerHTML = g +
    '<path d="' + path(pred) + '" fill="none" stroke="#d99a4e" stroke-width="1.3" ' +
    'stroke-dasharray="4 3" opacity=".9"/>' +
    '<path d="' + path(act) + '" fill="none" stroke="#a8ecff" stroke-width="2" ' +
    'stroke-linejoin="round" stroke-linecap="round"/>' +
    (tip.t >= a && tip.t <= b
      ? '<circle cx="' + X(tip.t).toFixed(1) + '" cy="' + Y(tip.v).toFixed(1) + '" r="3.5" fill="#a8ecff"/>'
      : "");

  var pv = pred.length ? pred[pred.length - 1].v : null;
  $("range").innerHTML = '<span style="color:#a8ecff">actual</span> ' + tip.v.toFixed(1) +
    '\u00B0 \u00b7 <span style="color:#d99a4e">model</span> ' +
    (pv === null ? "-" : pv.toFixed(1)) + '\u00B0';
}

async function chart() {
  try {
    if (!PAR) PAR = await api("params");
    var ev = await api("history", { h: 72 });
  } catch (e) { return; }
  var temps = ev.filter(function (e) { return e.c === "temp_current_f"; })
                .sort(function (x, y) { return x.t - y.t; });
  var sps = ev.filter(function (e) { return e.c === "temp_set_f"; })
              .sort(function (x, y) { return x.t - y.t; });
  if (temps.length < 3) return;
  HIST = { cross: crossings(temps), sps: sps, t0: temps[0].t };
  if (!HIST.cross.length) return;
  SPAN = [HIST.t0, Date.now()];
  if (!VIEW) VIEW = [Math.max(HIST.t0, Date.now() - 12 * 36e5), Date.now()];
  draw();
}

/* pan and zoom: drag to scroll, pinch to zoom, wheel on desktop */
(function () {
  var el = $("spark"), drag = null, pinch = null;
  var clamp = function () {
    var minSpan = 20 * 60000, maxSpan = SPAN[1] - SPAN[0] + 36e5;
    var s = Math.min(maxSpan, Math.max(minSpan, VIEW[1] - VIEW[0]));
    var c = (VIEW[0] + VIEW[1]) / 2;
    VIEW = [c - s / 2, c + s / 2];
    if (VIEW[1] > SPAN[1] + 36e5) { VIEW = [SPAN[1] + 36e5 - s, SPAN[1] + 36e5]; }
    if (VIEW[0] < SPAN[0] - 36e5) { VIEW = [SPAN[0] - 36e5, SPAN[0] - 36e5 + s]; }
  };
  var dist = function (t) {
    return Math.abs(t[0].clientX - t[1].clientX);
  };
  el.addEventListener("touchstart", function (e) {
    if (e.touches.length === 2) { pinch = { d: dist(e.touches), span: VIEW[1] - VIEW[0] }; drag = null; }
    else if (e.touches.length === 1) { drag = { x: e.touches[0].clientX, v: VIEW.slice() }; }
  }, { passive: true });
  el.addEventListener("touchmove", function (e) {
    if (!VIEW) return;
    if (pinch && e.touches.length === 2) {
      var r = dist(e.touches) / Math.max(1, pinch.d);
      var c = (VIEW[0] + VIEW[1]) / 2, s = pinch.span / r;
      VIEW = [c - s / 2, c + s / 2]; clamp(); draw();
    } else if (drag && e.touches.length === 1) {
      var dx = e.touches[0].clientX - drag.x;
      var per = (drag.v[1] - drag.v[0]) / el.clientWidth;
      VIEW = [drag.v[0] - dx * per, drag.v[1] - dx * per]; clamp(); draw();
    }
    e.preventDefault();
  }, { passive: false });
  el.addEventListener("touchend", function () { pinch = null; drag = null; }, { passive: true });
  el.addEventListener("wheel", function (e) {
    if (!VIEW) return;
    var c = (VIEW[0] + VIEW[1]) / 2, s = (VIEW[1] - VIEW[0]) * (e.deltaY > 0 ? 1.25 : .8);
    VIEW = [c - s / 2, c + s / 2]; clamp(); draw(); e.preventDefault();
  }, { passive: false });
  document.addEventListener("click", function (e) {
    var h = e.target.getAttribute && e.target.getAttribute("data-h");
    if (!h || !SPAN) return;
    VIEW = h === "all" ? [SPAN[0] - 36e5, SPAN[1] + 36e5]
                       : [Date.now() - Number(h) * 36e5, Date.now() + 18e5];
    clamp(); draw();
  });
})();

const today = new Date();
$("d").value = today.toISOString().slice(0, 10);
refresh(); chart();
setInterval(refresh, 30000);
setInterval(chart, 300000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { refresh(); chart(); } });
</script></body></html>
